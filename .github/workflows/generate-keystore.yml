name: Generar keystore de release

# Genera el keystore de release DENTRO del runner y guarda los cuatro secretos que
# consume .github/workflows/release.yml. Existe para que nadie necesite un JDK en su
# máquina: todo el material de clave se crea y se consume aquí, y se borra del runner
# al terminar.
#
# Disparo SOLO manual (workflow_dispatch): escribe secretos del repositorio, así que
# nunca debe colarse en un push ni en una PR. No hay paso de checkout porque no se lee
# nada del repositorio.

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: "Alias de la clave dentro del keystore (por defecto release)."
        required: false
        default: release
      store_password:
        description: "Contraseña del keystore (mínimo 6 caracteres). No se imprime en ningún log."
        required: true
      key_password:
        description: "Contraseña de la clave. Puede ser la misma que la del keystore."
        required: true
      validity_days:
        description: "Días de validez del certificado (por defecto 10000)."
        required: false
        default: "10000"
      confirm:
        description: "Escribe GENERAR para confirmar. Cualquier otro valor aborta sin crear nada."
        required: true

# contents: read basta: el workflow no lee nada del repositorio.
permissions:
  contents: read

jobs:
  keystore:
    name: Generar el keystore y guardar los secretos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # El runner ya trae un JDK, pero setup-java fija Temurin 17 y garantiza que
      # keytool está en el PATH del runner.
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Guarda 1: sin la confirmación exacta no se genera nada.
      - name: Comprobar la confirmación
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "GENERAR" ]; then
            echo "::error::El input «confirm» debe ser exactamente GENERAR. No se ha generado ningún keystore ni se ha tocado ningún secreto."
            exit 1
          fi
          echo "Confirmación recibida: se generará el keystore y se escribirán los cuatro secretos."

      # Guarda 2: el GITHUB_TOKEN automático NO puede crear secretos de repositorio,
      # así que hace falta un token fino (PAT) con Repository permissions →
      # Secrets: Read and write, guardado una sola vez como secreto GH_PAT.
      - name: Comprobar el PAT temporal (GH_PAT)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_PAT:-}" ]; then
            echo "::error::Falta el secreto GH_PAT. Créalo una vez en Settings → Secrets and variables → Actions → New repository secret con un token fino (Repository permissions → Secrets: Read and write) limitado a este repositorio. No se ha generado ningún keystore ni se ha tocado ningún secreto."
            exit 1
          fi
          if ! GH_TOKEN="$GH_PAT" gh auth status >/dev/null 2>&1; then
            echo "::error::El secreto GH_PAT no da una sesión válida de gh: revisa que el token no esté caducado ni revocado y que tenga el permiso Secrets: Read and write en este repositorio. No se ha generado ningún keystore ni se ha tocado ningún secreto."
            exit 1
          fi
          echo "PAT temporal válido para escribir secretos en este repositorio."

      # Generar, codificar y subir van en el MISMO bloque a propósito: el keystore y su
      # base64 solo existen dentro de este proceso y el trap de borrado se registra
      # ANTES de crear el primer fichero, así que no hay ninguna ventana en la que el
      # material de clave quede sin limpiar.
      - name: Generar el keystore, codificarlo y guardar los secretos
        env:
          # Las contraseñas entran como variables de entorno del paso. Nunca se
          # interpolan en el script (acabarían en el log del run) ni se pasan por
          # argv (serían visibles en ps): keytool las lee con -storepass:env y
          # -keypass:env, y gh las recibe por stdin.
          STORE_PASSWORD: ${{ inputs.store_password }}
          KEY_PASSWORD: ${{ inputs.key_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
          VALIDITY_DAYS: ${{ inputs.validity_days }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/usipipo-release.jks"
          BASE64_FILE="$RUNNER_TEMP/usipipo-release.jks.b64"
          # El keystore y su base64 se borran del runner pase lo que pase.
          trap 'rm -f "$KEYSTORE" "$BASE64_FILE"' EXIT

          # --- Validaciones: fallar claro y antes de crear nada ---
          case "$KEY_ALIAS" in
            ''|*[!A-Za-z0-9_.-]*)
              echo "::error::El alias «$KEY_ALIAS» solo puede contener letras, dígitos, puntos, guiones y guiones bajos."
              exit 1
              ;;
          esac
          case "$VALIDITY_DAYS" in
            ''|*[!0-9]*|0)
              echo "::error::validity_days debe ser un número entero mayor que cero (valor recibido: «$VALIDITY_DAYS»)."
              exit 1
              ;;
          esac
          if [ "${#STORE_PASSWORD}" -lt 6 ]; then
            echo "::error::La contraseña del keystore debe tener al menos 6 caracteres (lo exige keytool)."
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::La contraseña de la clave no puede estar vacía."
            exit 1
          fi
          echo "Generando el keystore: alias=$KEY_ALIAS, RSA 2048, validez $VALIDITY_DAYS días."

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity "$VALIDITY_DAYS" \
            -storepass:env STORE_PASSWORD \
            -keypass:env KEY_PASSWORD \
            -dname "CN=uSipipo VPN, O=usipipo, C=ES" >/dev/null \
            || { echo "::error::keytool no pudo generar el keystore. No se ha tocado ningún secreto."; exit 1; }

          # Se comprueba que el keystore se abre con la contraseña dada antes de subir nada.
          keytool -list -v -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
            -storepass:env STORE_PASSWORD >/dev/null \
            || { echo "::error::No se puede leer el keystore generado con esa contraseña. No se ha tocado ningún secreto."; exit 1; }
          echo "Keystore generado y verificado."

          base64 -w0 "$KEYSTORE" > "$BASE64_FILE"
          [ -s "$BASE64_FILE" ] || { echo "::error::La conversión a base64 falló."; exit 1; }

          # El PAT temporal se usa como GH_TOKEN: gh secret set necesita un token con
          # permiso para escribir secretos, que el GITHUB_TOKEN automático no tiene.
          export GH_TOKEN="$GH_PAT"
          REPO="$GITHUB_REPOSITORY"
          echo "Guardando los cuatro secretos en $REPO..."

          # El keystore viaja desde el fichero; el resto, por stdin. Ninguna
          # contraseña se imprime ni queda en el historial del shell.
          gh secret set ANDROID_KEYSTORE_BASE64 --repo "$REPO" < "$BASE64_FILE" \
            || { echo "::error::No se pudo guardar el secreto ANDROID_KEYSTORE_BASE64."; exit 1; }
          printf '%s' "$STORE_PASSWORD" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$REPO" \
            || { echo "::error::No se pudo guardar el secreto ANDROID_KEYSTORE_PASSWORD."; exit 1; }
          printf '%s' "$KEY_ALIAS" | gh secret set ANDROID_KEY_ALIAS --repo "$REPO" \
            || { echo "::error::No se pudo guardar el secreto ANDROID_KEY_ALIAS."; exit 1; }
          printf '%s' "$KEY_PASSWORD" | gh secret set ANDROID_KEY_PASSWORD --repo "$REPO" \
            || { echo "::error::No se pudo guardar el secreto ANDROID_KEY_PASSWORD."; exit 1; }
          echo "Los cuatro secretos se han guardado."

          # Las contraseñas ya no hacen falta en este shell.
          unset STORE_PASSWORD KEY_PASSWORD

      # Guarda final: los secretos tienen que existir de verdad en GitHub. gh secret
      # list solo muestra nombres y fechas, nunca valores.
      - name: Verificar que los cuatro secretos existen
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          export GH_TOKEN="$GH_PAT"
          REPO="$GITHUB_REPOSITORY"
          if ! LIST="$(gh secret list --repo "$REPO")"; then
            echo "::error::No se pudo leer la lista de secretos de $REPO con el PAT temporal: revisa que el token tenga el permiso Secrets: Read and write."
            exit 1
          fi
          printf '%s\n' "$LIST"
          MISSING=()
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            printf '%s\n' "$LIST" | awk '{print $1}' | grep -qx "$NAME" || MISSING+=("$NAME")
          done
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Después de guardarlos siguen faltando secretos: ${MISSING[*]}. Vuelve a lanzar el workflow."
            exit 1
          fi
          echo "Los cuatro secretos están en GitHub."

      # Resumen sin material sensible: ni contraseñas, ni base64, ni keystore.
      - name: Imprimir el resumen
        env:
          KEY_ALIAS: ${{ inputs.key_alias }}
          VALIDITY_DAYS: ${{ inputs.validity_days }}
        run: |
          set -euo pipefail
          echo "=== Keystore de release generado ==="
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Alias: $KEY_ALIAS"
          echo "Validez del certificado: $VALIDITY_DAYS días"
          echo "Tipo: RSA 2048, keystore .jks generado en el runner y borrado al terminar"
          echo ""
          echo "Secretos guardados:"
          echo "  - ANDROID_KEYSTORE_BASE64 (keystore en base64)"
          echo "  - ANDROID_KEYSTORE_PASSWORD"
          echo "  - ANDROID_KEY_ALIAS"
          echo "  - ANDROID_KEY_PASSWORD"
          echo ""
          echo "Siguientes pasos:"
          echo "  1. Revoca el PAT temporal del secreto GH_PAT: ya no hace falta (Settings"
          echo "     → Applications → Fine-grained tokens, o donde lo crearas)."
          echo "  2. Guarda las contraseñas en un gestor de contraseñas. GitHub no permite"
          echo "     volver a leer los secretos y sin ellas el keystore no sirve."
          echo "  3. Publica la release firmada con los secretos nuevos:"
          echo "       git tag vX.Y.Z && git push origin vX.Y.Z"
          echo "     (o lanza .github/workflows/release.yml a mano)."
          echo "  4. Si el repositorio se volvió privado solo para esta operación, ya puede"
          echo "     volver a público."
