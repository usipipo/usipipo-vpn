name: Release firmada

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Compilar y publicar la release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Verdadero solo cuando el workflow se dispara con una etiqueta vX.Y.Z.
      # La rama por defecto decide si se puede disparar; este flag decide el camino.
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Secretos de firma (a nivel de job para no repetirlos en cada paso).
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Desde la API 37 la plataforma se publica con versión menor incluida:
      # el paquete es platforms;android-37.0 (no existe platforms;android-37).
      # AGP 9.3 usa build-tools 36.0.0 por defecto.
      - name: Install Android SDK platform and build-tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Las etiquetas no disparan android-ci.yml: sin esta puerta, una release podría
      # publicarse con las pruebas en rojo.
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # ---------------------------------------------------------------
      # Camino con etiqueta vX.Y.Z: versión desde la etiqueta, firma y release.
      # ---------------------------------------------------------------

      - name: Calcular VERSION_NAME y VERSION_CODE desde la etiqueta
        id: version
        if: env.IS_TAG == 'true'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NAME="${TAG#v}"
          if ! printf '%s' "$VERSION_NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::La etiqueta \"$TAG\" no tiene el formato vX.Y.Z (por ejemplo v0.2.3)."
            exit 1
          fi
          MAJOR="${VERSION_NAME%%.*}"
          REST="${VERSION_NAME#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          # 10# evita que un componente con cero inicial (v1.08.3) se lea en octal.
          # Cada componente debe ser < 1000 para que el versionCode no colisione
          # (v0.0.100 ya no da lo mismo que v0.1.0).
          for COMP in "$MAJOR" "$MINOR" "$PATCH"; do
            if [ "$(( 10#$COMP ))" -ge 1000 ]; then
              echo "::error::El componente \"$COMP\" de \"$VERSION_NAME\" debe ser menor que 1000."
              exit 1
            fi
          done
          VERSION_CODE=$(( 10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH ))
          {
            echo "tag=$TAG"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          echo "Etiqueta $TAG → versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Comprobar los secretos de firma
        if: env.IS_TAG == 'true'
        run: |
          set -euo pipefail
          missing=()
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "${ANDROID_KEY_ALIAS:-}" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "${ANDROID_KEY_PASSWORD:-}" ] || missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Faltan secretos de firma para publicar la release: ${missing[*]}."
            echo "::error::Ejecuta scripts/setup-release-signing.sh en tu máquina (o añádelos en Settings → Secrets and variables → Actions). No se publica nada sin firma."
            exit 1
          fi
          echo "Los cuatro secretos de firma están presentes."

      - name: Decodificar el keystore
        if: env.IS_TAG == 'true'
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::El keystore decodificado está vacío; revisa el secreto ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "Keystore decodificado en $RUNNER_TEMP/release.jks"

      - name: Compilar la APK release firmada (etiqueta)
        if: env.IS_TAG == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew --no-daemon assembleRelease "-PVERSION_NAME=$VERSION_NAME" "-PVERSION_CODE=$VERSION_CODE"

      # ---------------------------------------------------------------
      # Camino sin etiqueta (workflow_dispatch): release SIN firma, solo artefacto.
      # ---------------------------------------------------------------

      - name: Compilar la APK release sin firmar (disparo manual)
        if: env.IS_TAG != 'true'
        run: ./gradlew --no-daemon assembleRelease

      - name: Subir la APK como artefacto del run
        uses: actions/upload-artifact@v4
        with:
          name: usipipo-vpn-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      # La firma se comprueba antes de publicar: la promesa de no distribuir nunca
      # una APK sin firmar no puede descansar solo en que existan los secretos.
      - name: Verificar la firma de la APK
        if: env.IS_TAG == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::No se encontró la APK firmada en $APK."
            exit 1
          fi
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::No se encontró apksigner en $APKSIGNER."
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"
          echo "APK firmada y verificada con apksigner."

      - name: Publicar la release con la APK firmada
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          REPO="${{ github.repository }}"
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::No se encontró la APK firmada en $APK."
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # Reintento o etiqueta republicada: se sustituye el adjunto en lugar de
            # dejar el job roto para siempre.
            gh release upload "$TAG" "$APK" --repo "$REPO" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$REPO" \
              --title "uSipipo VPN $VERSION_NAME" \
              --generate-notes
          fi
